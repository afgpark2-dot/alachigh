version: '3.8'
services:
  server:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./server:/app
      - server_data:/app/data
    ports:
      - "3001:3001"
    command: sh -c "npm install && node index.js"
    environment:
      - PORT=3001

  client:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./client:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - server

volumes:
  server_data:
